name: Build & Deploy KleenPulse Africa (Web, Android, iOS)

on:
  push:
    branches: [ main, master, arena/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-web:
    name: Build & Test Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kleenpulse-web-dist
          path: dist/

  build-android:
    name: Build Android Native App (.apk / .aab)
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies & build web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: kleenpulse-android-build
          path: android/app/build/outputs/apk/
